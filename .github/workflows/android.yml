name: Dobby — build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk dobby-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dobby-${{ github.run_number }}
          path: dobby-${{ github.run_number }}.apk
          retention-days: 30

      # On main: publish a GitHub Release so the app's "Check for updates" can find it.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dobby build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: dobby-${{ github.run_number }}.apk
